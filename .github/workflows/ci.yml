name: CI

on:
  push:
    branches: [main]
    # Docs/meta-only changes skip CI entirely — and because deploy fires on CI
    # completion, they never deploy either. Deliberately a denylist: anything
    # NOT listed still runs CI and deploys, so a future path can never
    # silently stop shipping. Keep in sync with what deploy.sh actually ships
    # (gunbatte-server, viewer/dist/, website/): a path that changes those
    # belongs OFF this list. YAML anchors are not supported here — the two
    # lists below are duplicates; edit both.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

env:
  CARGO_TERM_COLOR: always

# Issue #38: dependency audit against the RustSec advisory DB. Runs beside
# (not inside) the test jobs — it needs no toolchain. Fails the run on known
# vulnerabilities; advisory-level hygiene notes (unmaintained crates and the
# like) show in the log without blocking. The permissions block is what keeps
# that contract: without `checks: write` the action cannot publish its check
# run on push-to-main (pull_request runs fall back to stdout), and the job
# then fails on the API permission error — hygiene notes included — instead
# of on the advisories themselves.
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (debug)
        run: cargo test --workspace
      - name: "Tests (release — M1 acceptance: 16 bots < 1s, replay byte-identical)"
        run: cargo test --release --workspace

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/*
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM sim
        run: wasm-pack build crates/gunbatte-wasm --target web --release --out-dir ../../viewer/src/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build viewer
        working-directory: viewer
        run: npm install && npm run build

  # The deploy path's contract is a shell artifact, not Rust, so it gets its
  # own cheap job: stage a fake tree and assert the tar root, the preserved
  # state exclusions, the fixed identity/path and the absence of a second
  # writer. See tests/deploy-contract.sh.
  deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy artifact contract
        run: |
          bash -n deploy.sh tests/deploy-contract.sh
          bash tests/deploy-contract.sh
