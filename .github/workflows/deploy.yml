# Deploy — push-to-deploy for the game + website.
#
# Fires AFTER the CI workflow finishes green on main (or on a manual dispatch),
# then runs the exact same ./deploy.sh a human would: build viewer + server,
# upload the code artifact as `gunbatte-deploy`, run the box's shared
# `vps-deploy gunbatte` helper, then run the shared post-deploy doctor gate
# (/srv/vps-ops/doctor.sh) as the deploy identity. Host configuration (the
# unit, nginx site, sudoers grant and deploy contract) lives in ahaqqu/vps and
# is installed by its owner-run bootstrap; this workflow has no bootstrap,
# nginx or systemd step.
#
# Docs/meta-only changes never get here: ci.yml's paths-ignore skips CI for
# them, and without a completed CI run this workflow cannot fire. Manual
# workflow_dispatch stays unconditional — explicit human intent always deploys.
#
# Configuration comes from repository VARIABLES (Settings → Secrets and
# variables → Actions → Variables — nothing is hardcoded in this file):
#   VPS_USER            deploy identity (default: gunbatte-deploy)
#   VPS_HOST            the VPS address (e.g. 62.83.35.220)
#   GUNBATTE_GAME_HOST  game hostname (e.g. play.gunbatte.ahaqqu.com)
# and these SECRETS (unchanged):
#   VPS_DEPLOY_SSH_KEY  private half of the deploy identity's key
#   VPS_KNOWN_HOSTS     ssh-keyscan of VPS_HOST
name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VPS_USER: ${{ vars.VPS_USER || 'gunbatte-deploy' }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      GUNBATTE_GAME_HOST: ${{ vars.GUNBATTE_GAME_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required variables
        # Keep this list in sync with the values deploy.sh reads: a variable
        # the script needs but this job does not export fails with a clear
        # message here instead of mid-deploy. VPS_USER is optional because
        # deploy.sh defaults it to gunbatte-deploy.
        run: |
          missing=0
          for v in VPS_HOST GUNBATTE_GAME_HOST; do
            if [ -z "$(printenv "$v")" ]; then
              echo "::error::Repository variable '$v' is not set — add it under Settings → Secrets and variables → Actions → Variables"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        # Official installer (jetli/wasm-pack-action 404s on 'latest' — it
        # builds a doubled-v release URL). Installs into ~/.cargo/bin, which
        # rust-cache persists.
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Set up SSH
        # A per-step ssh-agent would not survive into the deploy step (fresh
        # shell each step), so pin the key via ~/.ssh/config instead.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy (build + upload + vps-deploy + doctor)
        run: ./deploy.sh
